[project]
name = "video-learning-agent"
version = "0.1.0"
description = "Automate video transcript fetching, remote GPU ASR, markdown digestion, and local search."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
remote = ["paramiko>=3.4.0"]
yaml = ["PyYAML>=6.0.0"]
mcp = ["mcp>=1.0.0"]
test = ["pytest>=8.0.0"]

[project.scripts]
video-agent = "video_learning_agent.cli:main"
video-agent-mcp = "video_learning_agent.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

